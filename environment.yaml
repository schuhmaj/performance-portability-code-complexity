# Conda environment for the ppbcc package.
#
# Create the environment and install the package itself with:
#   conda env create -f environment.yaml
#   conda activate ppbcc
#   pip install -e .
name: ppbcc
channels:
  - conda-forge
dependencies:
  - python>=3.12          # the package uses 3.12+ features (e.g. tomllib, modern typing)
  - pandas>=2.0           # result table handling and CSV export
  - loguru>=0.7           # logging
  - tabulate>=0.9         # pretty-printing the result table on stdout
  - matplotlib>=3.8       # plot rendering
  - numpy>=1.26           # numerical metric and plot processing
  - seaborn>=0.13         # statistical plotting
  - pytest>=8.0           # running the test suite (development only)
  - pytest-xdist
  - pip
