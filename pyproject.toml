[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppbcc"
version = "0.1.0"
description = "Performance-portability benchmarking, analysis, plotting, and code-complexity metrics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ email = "jo.schuhmacher37@web.de" }]
keywords = [
    "halstead",
    "complexity",
    "metrics",
    "performance-portability",
    "gpu",
    "static-analysis",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pandas>=2.0",
    "loguru>=0.7",
    "tabulate>=0.9",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "seaborn>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ppbcc = "ppbcc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ppbcc.code_complexity" = ["share/*.toml"]

[tool.pytest.ini_options]
testpaths = ["test"]
