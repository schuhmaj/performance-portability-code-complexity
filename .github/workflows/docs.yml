name: Deploy Sphinx documentation to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  GITHUB_PAGES_BUILD: True

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ppbcc from recent source for sphinx.ext.autodoc
        shell: bash -l {0}
        run: pip install . -vv
      - id: deployment
        uses: sphinx-notes/pages@v3
        with:
          checkout: false
